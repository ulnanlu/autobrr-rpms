[project]
name = "mkbrr-community-repository"
version = "1.0.0"
description = "Independent, verified and signed redistribution of official mkbrr RPMs"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607", "S310"]
