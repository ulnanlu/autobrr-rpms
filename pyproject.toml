[project]
name = "autobrr-rpms"
version = "1.0.0"
description = "Unofficial source-built autobrr application RPMs for Fedora and EL on COPR"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607", "S310"]
