name: Sync and publish RPM repository

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Re-verify and republish even if upstream is unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: read

concurrency:
  group: mkbrr-pages-publication
  cancel-in-progress: false

jobs:
  build:
    # Never make signing secrets available on pull requests or non-default branches.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check one-time signing setup
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_FINGERPRINT: ${{ vars.RPM_SIGNING_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RPM_SIGNING_KEY" || ! "$RPM_SIGNING_FINGERPRINT" =~ ^[A-Fa-f0-9]{40}$ || ! -s config/signing-key.asc ]]; then
            echo '::error::Signing is not configured. See docs/maintaining.md#signing-key-setup: commit config/signing-key.asc, set RPM_SIGNING_KEY and RPM_SIGNING_PASSPHRASE secrets, and RPM_SIGNING_FINGERPRINT variable. No unsigned repository will be published.'
            exit 1
          fi
      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm createrepo-c gnupg dnf
          rpm --version
          rpmsign --version
          createrepo_c --version
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Inspect GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Synchronize, sign and validate
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
          RPM_SIGNING_FINGERPRINT: ${{ vars.RPM_SIGNING_FINGERPRINT }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repository "$GITHUB_REPOSITORY" --base-url "$PAGES_URL" --check-published)
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          python3 scripts/sync.py "${args[@]}"
      - name: DNF consumer validation
        if: steps.sync.outputs.changed == 'true'
        run: python3 scripts/test_dnf.py --site site
      - name: Publication summary
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository changed: $CHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages URL: $PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CHANGED" == true ]]; then
            du -sh site >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload validated Pages site
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
