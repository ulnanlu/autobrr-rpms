name: Validate COPR packaging

on:
  pull_request:
    paths:
      - 'config/copr.json'
      - 'packaging/**'
      - 'scripts/copr_sync.py'
      - 'scripts/common.py'
      - 'tests/test_copr_sync.py'
      - 'tests/test_common.py'
      - '.github/workflows/copr*.yml'
  push:
    branches: [main]
    paths:
      - 'config/copr.json'
      - 'packaging/**'
      - 'scripts/copr_sync.py'
      - 'scripts/common.py'
      - 'tests/test_copr_sync.py'
      - 'tests/test_common.py'
      - '.github/workflows/copr*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: source-build (${{ matrix.distro.name }}, ${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: fedora44, image: 'registry.fedoraproject.org/fedora:44', python: python3, node: nodejs24 }
          - { name: fedora45, image: 'registry.fedoraproject.org/fedora:45', python: python3, node: nodejs24 }
          - { name: el9, image: 'docker.io/library/almalinux:9', python: python3.12, node: nodejs }
          - { name: el10, image: 'docker.io/library/almalinux:10', python: python3, node: nodejs24 }
        package: [mkbrr, autobrr, qui, tqm, sfvbrr]
    runs-on: ubuntu-24.04
    container: ${{ matrix.distro.image }}
    timeout-minutes: 90
    env:
      PYTHON: ${{ matrix.distro.python }}
    steps:
      - name: Install source build tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.distro.name }}' == el9 ]]; then
            dnf -y install dnf-plugins-core
            dnf config-manager --set-enabled crb
            dnf -y module enable nodejs:24
          fi
          dnf -y install "$PYTHON" golang '${{ matrix.distro.node }}' systemd-rpm-macros rpm-build rpm-sign gnupg2 redhat-rpm-config git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: '"$PYTHON" -m unittest discover -s tests -v'
      - name: Prepare unmodified upstream source and vendored dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: '"$PYTHON" scripts/copr_sync.py prepare --package "$PACKAGE"'
      - name: Compile, run upstream tests, and install in a disposable root
        run: |
          "$PYTHON" scripts/copr_sync.py build
          "$PYTHON" scripts/copr_sync.py test-install
