name: Validate COPR packaging

on:
  pull_request:
    paths:
      - 'config/copr.json'
      - 'packaging/**'
      - 'scripts/copr_sync.py'
      - 'scripts/common.py'
      - 'tests/test_copr_sync.py'
      - 'tests/test_common.py'
      - '.github/workflows/copr*.yml'
  push:
    branches: [main]
    paths:
      - 'config/copr.json'
      - 'packaging/**'
      - 'scripts/copr_sync.py'
      - 'scripts/common.py'
      - 'tests/test_copr_sync.py'
      - 'tests/test_common.py'
      - '.github/workflows/copr*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    strategy:
      fail-fast: false
      matrix:
        fedora: ['44', '45']
        package: [mkbrr, autobrr, qui]
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    timeout-minutes: 60
    steps:
      - name: Install source build tools
        run: dnf -y install python3 golang nodejs24 systemd-rpm-macros rpm-build rpm-sign gnupg2 redhat-rpm-config git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Prepare unmodified upstream source and vendored dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: python3 scripts/copr_sync.py prepare --package "$PACKAGE"
      - name: Compile, run upstream tests, and install in a disposable root
        run: |
          python3 scripts/copr_sync.py build
          python3 scripts/copr_sync.py test-install
