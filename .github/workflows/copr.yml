name: COPR source builds

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this version/release already succeeded
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'config/copr.json'
      - 'packaging/**'
      - 'scripts/copr_sync.py'
      - 'scripts/common.py'
      - '.github/workflows/copr.yml'

permissions:
  contents: read

concurrency:
  group: copr-publication
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (vars.COPR_PROJECT != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 90
    outputs:
      packages: ${{ steps.prepare.outputs.packages }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Install source packaging tools
        run: dnf -y install python3 golang nodejs24 systemd-rpm-macros rpm-build rpm-sign gnupg2 redhat-rpm-config copr-cli git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare, build and test changed packages
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$COPR_PROJECT" ]]; then
            echo '::error::Configure COPR_PROJECT and COPR_CONFIG using docs/maintaining.md first.'
            exit 1
          fi
          python3 - <<'PY'
          import json
          import logging
          import os
          from pathlib import Path
          from scripts import copr_sync as copr
          logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")
          changed = []
          config, _ = copr.settings()
          for package in config["packages"]:
              output = Path(".work/copr", package).resolve()
              if copr.prepare(package, output, os.environ["COPR_PROJECT"], os.environ["FORCE"] == "true"):
                  copr.build_local(output)
                  copr.test_install(output)
                  changed.append(package)
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"packages={json.dumps(changed)}\n")
          PY
      - name: Upload source package
        id: upload
        if: steps.prepare.outputs.packages != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copr-source
          path: |
            .work/copr/*/plan.json
            .work/copr/*/SRPMS/*.src.rpm
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  submit:
    needs: source
    if: needs.source.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.source.outputs.packages) }}
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45
    environment: copr
    timeout-minutes: 110
    steps:
      - name: Install COPR client
        run: dnf -y install python3 copr-cli git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: copr-source
          path: .work/copr
      - name: Submit and wait for signed COPR builds
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
          FORCE: ${{ inputs.force || false }}
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$COPR_CONFIG" ]]; then
            echo '::error::COPR_CONFIG secret is missing. See docs/maintaining.md.'
            exit 1
          fi
          args=(--target "$COPR_PROJECT" --output ".work/copr/$PACKAGE")
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          python3 scripts/copr_sync.py submit "${args[@]}"

  cleanup:
    needs: [source, submit]
    if: needs.submit.result == 'success' && needs.source.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Remove this run's intermediate SRPM artifact after COPR publication
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.source.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
